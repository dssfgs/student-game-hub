<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>物理实验室 · 交互式模拟</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#0b0f19;color:#dbe4f0;overflow:hidden}
#app{display:flex;height:100vh;width:100vw}

/* 左侧实验列表 */
#sidebar{width:186px;flex:none;background:#111827;border-right:1px solid #1f2937;display:flex;flex-direction:column}
#sidebar h1{font-size:13px;padding:14px 12px 6px;color:#93c5fd;letter-spacing:2px}
#exlist{flex:1;overflow-y:auto;padding-bottom:24px}
.cat{font-size:11px;color:#64748b;padding:12px 12px 4px;letter-spacing:1px}
.ex{font-size:13px;padding:7px 12px;cursor:pointer;color:#cbd5e1;border-left:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex:hover{background:#1e293b}
.ex.active{background:#1d4ed8;color:#fff;border-left-color:#93c5fd}

/* 舞台 */
#stage{flex:1;display:flex;flex-direction:column;min-width:0}
#canvasWrap{flex:1;position:relative;min-height:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#params{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:9px 14px;background:#0f172a;border-top:1px solid #1f2937;min-height:44px}
.prow{display:flex;align-items:center;gap:7px;font-size:12px;color:#94a3b8}
.prow input[type=range]{width:96px;accent-color:#3b82f6;cursor:pointer}
.prow .val{color:#e2e8f0;min-width:42px;font-variant-numeric:tabular-nums}
select{background:#1e293b;color:#dbe4f0;border:1px solid #334155;border-radius:6px;padding:3px 6px;font-size:12px}
#toolbar{display:flex;gap:10px;align-items:center;padding:8px 14px;background:#111827;border-top:1px solid #1f2937;font-size:12px;flex-wrap:wrap}
button{background:#1e293b;color:#dbe4f0;border:1px solid #334155;border-radius:6px;padding:6px 13px;font-size:12px;cursor:pointer;transition:.15s}
button:hover{background:#334155}
button.on{background:#1d4ed8;border-color:#3b82f6;color:#fff}
#hint{margin-left:auto;color:#475569}

/* 右侧讲解 */
#info{width:330px;flex:none;background:#0f172a;border-left:1px solid #1f2937;overflow-y:auto;padding:18px;font-size:13px;line-height:1.75}
#info.hidden{display:none}
#info h2{font-size:16px;color:#93c5fd;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #1e293b}
#info h3{font-size:12px;color:#f59e0b;margin:16px 0 6px;letter-spacing:1px}
#info p{color:#b6c2d4;font-size:12.5px}
.fml{background:#111c2e;border-left:2px solid #3b82f6;padding:6px 10px;margin-bottom:6px;border-radius:0 6px 6px 0;font-family:"Consolas",monospace;font-size:12.5px;color:#a5d8ff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h1>物理实验室</h1>
    <div id="exlist"></div>
  </aside>

  <main id="stage">
    <div id="canvasWrap"><canvas id="cv"></canvas></div>
    <div id="params"></div>
    <div id="toolbar">
      <button id="btnPlay" class="on">⏸ 暂停</button>
      <button id="btnReset">↻ 重置</button>
      <button id="btnInfo" class="on">📘 讲解</button>
      <span id="hint">点击左侧实验切换 · 拖动滑块改变变量</span>
    </div>
  </main>

  <aside id="info">
    <h2 id="infoName">—</h2>
    <h3>📜 历史背景</h3>
    <p id="infoHist"></p>
    <h3>🧮 关键公式</h3>
    <div id="infoFormulas"></div>
    <h3>💡 知识讲解</h3>
    <p id="infoKnow"></p>
  </aside>
</div>

<script>
/* ===================== 基础工具 ===================== */
const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a:v>b?b:v;

function txt(g,s,x,y,color='#cbd5e1',size=12,align='left',baseline='middle'){
  g.fillStyle=color;
  g.font=`${size}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  g.textAlign=align; g.textBaseline=baseline;
  g.fillText(s,x,y);
}
function arrow(g,x1,y1,x2,y2,color,lw=2,head=9){
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy);
  if(len<0.8) return;
  const ux=dx/len, uy=dy/len;
  g.strokeStyle=color; g.fillStyle=color; g.lineWidth=lw; g.lineCap='round';
  g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2-ux*head*0.7, y2-uy*head*0.7); g.stroke();
  g.beginPath();
  g.moveTo(x2,y2);
  g.lineTo(x2-ux*head-uy*head*0.42, y2-uy*head+ux*head*0.42);
  g.lineTo(x2-ux*head+uy*head*0.42, y2-uy*head-ux*head*0.42);
  g.closePath(); g.fill();
}
function bg(g,W,H,c='#0b0f19'){ g.fillStyle=c; g.fillRect(0,0,W,H); }
function grid(g,W,H,step=40,color='#131c2b'){
  g.strokeStyle=color; g.lineWidth=1;
  for(let x=0;x<W;x+=step){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); }
  for(let y=0;y<H;y+=step){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
}

/* ===================== 实验定义 ===================== */
const EX = [];

/* ---------- 1. 抛体运动 ---------- */
EX.push({
  id:'proj', name:'抛体运动', cat:'经典力学',
  hist:'伽利略在 1638 年出版的《关于两门新科学的对话》中，通过斜面实验和逻辑推理指出：抛体运动可以分解为水平方向的匀速直线运动与竖直方向的匀加速运动。这一"运动的合成"思想是近代物理学的开端。',
  formulas:['水平：x = v₀·cosθ · t','竖直：y = v₀·sinθ · t − ½g t²','射程：R = v₀²·sin2θ / g','最大高度：H = v₀²·sin²θ / (2g)'],
  knowledge:'忽略空气阻力时，抛体在水平方向不受力，速度分量保持不变；竖直方向只受重力作用，做匀变速运动。两者的合成使得轨迹成为抛物线。当发射角为 45° 时射程最大；互余的两个角度（如 30° 与 60°）射程相同，但高度和飞行时间不同。',
  params:{
    v0:{label:'初速度 v₀', min:5, max:80, step:1, val:30},
    ang:{label:'抛射角 θ', min:5, max:85, step:1, val:45},
    g:{label:'重力 g', min:1, max:25, step:0.1, val:9.8}
  },
  reset(st,p){ st.t=0; st.done=false; st.trail=[]; st.x=0; st.y=0; },
  update(st,p,dt){
    if(st.done) return;
    st.t += dt;
    const th=p.ang.val*Math.PI/180, vx=p.v0.val*Math.cos(th), vy=p.v0.val*Math.sin(th);
    st.x = vx*st.t;
    st.y = vy*st.t - 0.5*p.g.val*st.t*st.t;
    st.trail.push([st.x,st.y]);
    if(st.trail.length>3000) st.trail.shift();
    if(st.y<=0 && st.t>0.08){ st.y=0; st.done=true; }
  },
  draw(g,st,p,W,H){
    bg(g,W,H);
    const th=p.ang.val*Math.PI/180, v0=p.v0.val, G=p.g.val;
    const vx=v0*Math.cos(th), vy0=v0*Math.sin(th);
    const R=vx*2*vy0/G, Hm=vy0*vy0/(2*G);
    const padL=70,padR=50,padT=60,padB=70;
    const aw=W-padL-padR, ah=H-padT-padB;
    const s=Math.min(aw/Math.max(R,1), ah/Math.max(Hm,1));
    const ox=padL, oy=H-padB;
    const X=x=>ox+x*s, Y=y=>oy-y*s;

    g.strokeStyle='#334155'; g.lineWidth=2;
    g.beginPath(); g.moveTo(0,oy); g.lineTo(W,oy); g.stroke();
    g.strokeStyle='#1a2434'; g.lineWidth=1;
    for(let x=-20;x<W;x+=22){ g.beginPath(); g.moveTo(x,oy); g.lineTo(x-11,oy+11); g.stroke(); }

    g.strokeStyle='#38bdf8'; g.lineWidth=2; g.beginPath();
    st.trail.forEach(([x,y],i)=>{ const px=X(x),py=Y(y); i?g.lineTo(px,py):g.moveTo(px,py); });
    g.stroke();

    const px=X(st.x), py=Y(st.y);
    const vxN=vx, vyN=vy0-G*st.t;
    const sp=Math.hypot(vxN,vyN)||1;
    arrow(g,px,py,px+vxN/sp*56,py-vyN/sp*56,'#facc15',2,9);

    const grd=g.createRadialGradient(px-3,py-3,2,px,py,12);
    grd.addColorStop(0,'#fdba74'); grd.addColorStop(1,'#f97316');
    g.fillStyle=grd; g.beginPath(); g.arc(px,py,9,0,TAU); g.fill();

    txt(g,`射程 R = ${R.toFixed(1)} m`,padL,26,'#93c5fd',14);
    txt(g,`最大高度 = ${Hm.toFixed(1)} m`,padL,48,'#93c5fd',14);
    txt(g,`t = ${st.t.toFixed(2)} s`,padL,70,'#94a3b8',13);
    txt(g,`v₀ = ${v0} m/s   θ = ${p.ang.val}°`,W-padR,26,'#64748b',13,'right');
  }
});

/* ---------- 2. 单摆 ---------- */
EX.push({
  id:'pend', name:'单摆', cat:'经典力学',
  hist:'伽利略在比萨大教堂观察到吊灯摆动后，发现摆的周期与振幅无关（等时性）。1656 年惠更斯利用单摆制成了第一台摆钟，使计时精度提高到每天误差仅数秒。',
  formulas:['运动方程：θ″ = −(g/L)·sinθ','小角度周期：T = 2π√(L/g)','能量：E = ½mL²θ′² + mgL(1−cosθ)'],
  knowledge:'单摆在重力分量 mg·sinθ 的作用下绕悬点转动。小角度时 sinθ ≈ θ，方程变为简谐振动，周期只与摆长 L 和重力加速度 g 有关，与摆球质量和振幅无关——这正是摆钟的原理。大角度摆动时周期会略微变长，称为"振幅的非线性效应"。',
  params:{
    L:{label:'摆长 L', min:0.4, max:3, step:0.05, val:1.5},
    g:{label:'重力 g', min:1, max:25, step:0.1, val:9.8},
    a0:{label:'初始角 θ₀', min:5, max:80, step:1, val:35},
    damp:{label:'阻尼', min:0, max:0.4, step:0.01, val:0}
  },
  reset(st,p){ st.th=p.a0.val*Math.PI/180; st.w=0; st.t=0; },
  update(st,p,dt){
    const n=6, h=dt/n;
    for(let i=0;i<n;i++){
      const acc = -(p.g.val/p.L.val)*Math.sin(st.th) - p.damp.val*st.w;
      st.w += acc*h; st.th += st.w*h;
    }
    st.t += dt;
  },
  draw(g,st,p,W,H){
    bg(g,W,H); grid(g,W,H,50);
    const ax=W/2, ay=H*0.13;
    const scale=(H*0.7)/3;
    const L=p.L.val*scale;
    const bx=ax+L*Math.sin(st.th), by=ay+L*Math.cos(st.th);

    g.strokeStyle='#334155'; g.setLineDash([6,6]); g.lineWidth=1;
    g.beginPath(); g.moveTo(ax,ay); g.lineTo(ax,ay+L+40); g.stroke();
    g.setLineDash([]);

    g.fillStyle='#475569'; g.beginPath(); g.arc(ax,ay,7,0,TAU); g.fill();

    g.strokeStyle='#94a3b8'; g.lineWidth=2.5;
    g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke();

    const grd=g.createRadialGradient(bx-4,by-4,2,bx,by,16);
    grd.addColorStop(0,'#fde68a'); grd.addColorStop(1,'#d97706');
    g.fillStyle=grd; g.beginPath(); g.arc(bx,by,14,0,TAU); g.fill();

    g.strokeStyle='#3b82f6'; g.lineWidth=2;
    g.beginPath(); g.arc(ax,ay,60,Math.PI/2,Math.PI/2+st.th,st.th<0); g.stroke();

    const T=TAU*Math.sqrt(p.L.val/p.g.val);
    txt(g,`理论周期 T = 2π√(L/g) = ${T.toFixed(2)} s`,20,28,'#93c5fd',14);
    txt(g,`当前摆角 θ = ${(st.th*180/Math.PI).toFixed(1)}°`,20,52,'#94a3b8',13);
    txt(g,`角速度 ω = ${st.w.toFixed(2)} rad/s`,20,74,'#94a3b8',13);
  }
});

/* ---------- 3. 弹簧振子 ---------- */
EX.push({
  id:'spring', name:'弹簧振子', cat:'经典力学',
  hist:'胡克于 1678 年发表"胡克定律"：弹簧的弹力与形变量成正比。此后牛顿第二定律与胡克定律结合，导出了简谐振动的完整数学描述，成为波动学与量子力学的基础模型。',
  formulas:['胡克定律：F = −kx','牛顿第二定律：ma = −kx − cv','角频率：ω = √(k/m)','周期：T = 2π√(m/k)'],
  knowledge:'弹簧振子是最典型的简谐振动模型。回复力始终指向平衡位置且与位移成正比，因此加速度也正比于位移。振动的周期由系统本身的性质（k 与 m）决定，称为固有周期。加入阻尼后振幅按指数衰减，能量逐渐转化为热能。',
  params:{
    k:{label:'劲度系数 k', min:5, max:120, step:1, val:40},
    m:{label:'质量 m', min:0.5, max:8, step:0.1, val:2},
    damp:{label:'阻尼 c', min:0, max:6, step:0.1, val:0.4},
    A:{label:'初始位移', min:0.2, max:1.5, step:0.05, val:1}
  },
  reset(st,p){ st.x=p.A.val; st.v=0; st.t=0; st.hist=[]; },
  update(st,p,dt){
    const n=6,h=dt/n;
    for(let i=0;i<n;i++){
      const a=-(p.k.val/p.m.val)*st.x - (p.damp.val/p.m.val)*st.v;
      st.v+=a*h; st.x+=st.v*h;
    }
    st.t+=dt;
    st.hist.push(st.x);
    if(st.hist.length>Math.round(W_H/3)) st.hist.shift();
  },
  draw(g,st,p,W,H){
    bg(g,W,H); grid(g,W,H,50);
    const cy=H*0.45, wallX=W*0.1;
    const restX=W*0.56, scale=Math.min(W*0.18,140);
    const mx=restX+st.x*scale;

    g.fillStyle='#334155'; g.fillRect(wallX-10,cy-70,10,140);

    // 弹簧
    const coils=16, x1=wallX, x2=mx-30;
    g.strokeStyle='#94a3b8'; g.lineWidth=2; g.beginPath(); g.moveTo(x1,cy);
    for(let i=0;i<=coils;i++){
      const t=i/coils, px=x1+(x2-x1)*t;
      const py=cy+Math.sin(t*TAU*coils)*16;
      g.lineTo(px,py);
    }
    g.lineTo(x2,cy); g.stroke();

    // 物块
    const bw=60,bh=60;
    g.fillStyle='#1d4ed8'; g.strokeStyle='#60a5fa'; g.lineWidth=2;
    g.beginPath(); g.roundRect(mx,cy-bh/2,bw,bh,8); g.fill(); g.stroke();
    txt(g,'m',mx+bw/2,cy,'#dbeafe',18,'center');

    // 平衡位置
    g.strokeStyle='#475569'; g.setLineDash([5,5]); g.lineWidth=1;
    g.beginPath(); g.moveTo(restX+30,cy-80); g.lineTo(restX+30,cy+80); g.stroke();
    g.setLineDash([]);

    // 位移标注
    arrow(g,restX+30,cy+70,mx+30,cy+70,'#f59e0b',2,7);
    txt(g,`x = ${st.x.toFixed(2)} m`,(restX+mx)/2+30,cy+90,'#f59e0b',12,'center');

    const T=TAU*Math.sqrt(p.m.val/p.k.val);
    txt(g,`ω = √(k/m) = ${Math.sqrt(p.k.val/p.m.val).toFixed(2)} rad/s`,20,28,'#93c5fd',14);
    txt(g,`T = 2π√(m/k) = ${T.toFixed(2)} s`,20,52,'#93c5fd',14);
    txt(g,`v = ${st.v.toFixed(2)} m/s`,20,76,'#94a3b8',13);

    // 位移曲线
    const gx=W*0.55, gy=H*0.72, gw=W*0.4, gh=H*0.2;
    g.strokeStyle='#1e293b'; g.lineWidth=1;
    g.strokeRect(gx,gy-gh/2,gw,gh);
    g.beginPath();
    st.hist.forEach((v,i)=>{
      const px=gx+ (i/st.hist.length)*gw;
      const py=gy - clamp(v/1.6,-1,1)*gh/2;
      i?g.lineTo(px,py):g.moveTo(px,py);
    });
    g.strokeStyle='#38bdf8'; g.lineWidth=2; g.stroke();
    txt(g,'位移—时间图像',gx,gy-gh/2-12,'#64748b',12);
  }
});
let W_H = 600;

/* ---------- 4. 斜面摩擦 ---------- */
EX.push({
  id:'incline', name:'斜面与摩擦力', cat:'经典力学',
  hist:'达·芬奇最早记录了摩擦现象；库仑在 1781 年通过大量实验确立了滑动摩擦力与正压力成正比的规律，即 f = μN，奠定了工程力学的基础。',
  formulas:['沿斜面方向：ma = mg·sinθ − f','正压力：N = mg·cosθ','最大静摩擦：f_max = μN','下滑条件：tanθ > μ'],
  knowledge:'物体放在斜面上时，重力可分解为沿斜面向下的 mg·sinθ 和垂直斜面的 mg·cosθ。摩擦力方向始终沿斜面阻碍相对滑动，其最大值由 μN 决定。当斜面倾角的正切值超过摩擦因数时，物体才会开始下滑——这就是"摩擦角"概念。',
  params:{
    ang:{label:'斜面倾角 θ', min:5, max:60, step:1, val:25},
    mu:{label:'摩擦因数 μ', min:0, max:1, step:0.01, val:0.25},
    m:{label:'质量 m', min:1, max:10, step:0.5, val:3},
    g:{label:'重力 g', min:1, max:25, step:0.1, val:9.8}
  },
  reset(st,p){ st.s=0; st.v=0; },
  update(st,p,dt){
    const th=p.ang.val*Math.PI/180, G=p.g.val;
    let a = G*(Math.sin(th) - p.mu.val*Math.cos(th));
    if(a<=0){ a=0; st.v=0; }
    st.v += a*dt;
    st.s += st.v*dt;
    if(st.s>1){ st.s=1; st.v=0; }
  },
  draw(g,st,p,W,H){
    bg(g,W,H); grid(g,W,H,50);
    const th=p.ang.val*Math.PI/180;
    let base=Math.min(W*0.6,560), h=base*Math.tan(th);
    const maxH=H*0.6;
    if(h>maxH){ h=maxH; base=h/Math.tan(th); }
    const x0=W*0.16, y0=H*0.82;
    const topL={x:x0,y:y0-h}, botR={x:x0+base,y:y0};

    g.fillStyle='#16233a'; g.strokeStyle='#3b82f6'; g.lineWidth=2;
    g.beginPath(); g.moveTo(x0,y0); g.lineTo(botR.x,y0); g.lineTo(topL.x,topL.y); g.closePath();
    g.fill(); g.stroke();

    const Ls=Math.hypot(base,h);
    const t=clamp(st.s,0,1);
    const bx=topL.x+(botR.x-topL.x)*t;
    const by=topL.y+(botR.y-topL.y)*t;

    // 物块
    g.save();
    g.translate(bx,by);
    g.rotate(th);
    g.fillStyle='#f59e0b'; g.strokeStyle='#fbbf24'; g.lineWidth=2;
    g.beginPath(); g.roundRect(-22,-38,44,38,5); g.fill(); g.stroke();
    g.restore();

    // 力箭头
    const cx=bx, cy=by-19;
    const G=p.g.val*p.m.val;
    const aLen = 70;
    arrow(g,cx,cy,cx,cy+aLen,'#ef4444',2.5,9);           // 重力
    arrow(g,cx,cy,cx+Math.cos(th)*70,cy-Math.sin(th)*70,'#22c55e',2.5,9); // 支持力
    if(st.v>0.01) arrow(g,cx,cy,cx-Math.cos(th)*50,cy+Math.sin(th)*50,'#a855f7',2.5,9);

    const a = p.g.val*(Math.sin(th)-p.mu.val*Math.cos(th));
    txt(g,`沿斜面加速度 a = ${Math.max(a,0).toFixed(2)} m/s²`,20,28,'#93c5fd',14);

  params:{

  draw(g,st,p,W,H){

    const charges=[
      {x:cx-d/2,y:cy,q:p.q1.val},
      {x:cx+d/2,y:cy,q:p.q2.val}
    ];
    const field=(x,y)=>{
      let ex=0,ey=0;
      for(const c of charges){
        const dx=x-c.x, dy=y-c.y;
        const r2=dx*dx+dy*dy;
        if(r2<36) continue;
        const r=Math.sqrt(r2);
        ex+=c.q*dx/(r2*r); ey+=c.q*dy/(r2*r);
      }
      return [ex,ey];
    };

    g.lineWidth=1.2;
    for(const c of charges){
      if(Math.abs(c.q)<0.1) continue;
      const N=Math.round(8+Math.abs(c.q)*3);

      for(let i=0;i<N;i++){
        const a=i*TAU/N+0.15;
        let x=c.x+Math.cos(a)*12, y=c.y+Math.sin(a)*12;
        g.strokeStyle=c.q>0?'rgba(248,113,113,0.5)':'rgba(96,165,250,0.5)';

          const [ex,ey]=field(x,y);
          const m=Math.hypot(ex,ey);

          x+=dirSign*ex/m*3; y+=dirSign*ey/m*3;

          for(const c2 of charges){ if(Math.hypot(x-c2.x,y-c2.y)<10){ hit=true; break; } }
          g.lineTo(x,y);
          if(hit) break;
        }
        g.stroke();
      }
    }

    for(const c of charges){
      const isPos=c.q>0;
      const col=isPos?'#ef4444':'#3b82f6';
      g.fillStyle=col; g.beginPath(); g.arc(c.x,c.y,18,0,TAU); g.fill();

    const L=L0/gamma;

    g.fillStyle='#334155';
    g.beginPath(); g.roundRect(W*0.2,barY-16,L0,32,6); g.fill();
    txt(g,'静止长度 L₀',W*0.2+L0/2,barY-30,'#94a3b8',12,'center');

    g.fillStyle='#22c55e';
    g.beginPath(); g.roundRect(W*0.2,barY+30,L,32,6); g.fill();
    txt(g,`运动长度 L = L₀/γ = ${(L/L0).toFixed(3)} L₀`,W*0.2+L/2,barY+80,'#22c55e',12,'center');

    arrow(g,W*0.2+L+20,barY+46,W*0.2+L+70,barY+46,'#22c55e',2,8);
    txt(g,`v = ${b.toFixed(2)}c`,W*0.2+L+80,barY+46,'#22c55e',12,'left');

    // 数据
    txt(g,`v = ${b.toFixed(2)} c`,W*0.78,H*0.10,'#93c5fd',15,'right');
    txt(g,`γ = ${gamma.toFixed(4)}`,W*0.78,H*0.10+26,'#38bdf8',16,'right');
    txt(g,`时间膨胀：Δt = γΔt₀`,W*0.78,H*0.10+52,'#f59e0b',13,'right');
    txt(g,`长度收缩：L = L₀/γ`,W*0.78,H*0.10+74,'#f59e0b',13,'right');
  }
});

/* ===================== 框架 ===================== */
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let W=1,H=1;

function resize(){
  const wrap=document.getElementById('canvasWrap');
  const dpr=Math.min(2,window.devicePixelRatio||1);
  W=wrap.clientWidth; H=wrap.clientHeight;
  cv.width=Math.floor(W*dpr); cv.height=Math.floor(H*dpr);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  W_H=H;
}
window.addEventListener('resize',resize);

let current=null, state={}, running=true;

function fmtVal(v,def){
  const dec=(def.step&&def.step<1)?(def.step<0.05?2:1):0;
  return v.toFixed(dec);
}

function buildParams(ex){
  const box=document.getElementById('params');
  box.innerHTML='';
  for(const [key,def] of Object.entries(ex.params)){
    const row=document.createElement('div'); row.className='prow';
    const lab=document.createElement('span'); lab.textContent=def.label;

    if(def.type==='select'){
      const sel=document.createElement('select');
      def.options.forEach((o,i)=>{
        const op=document.createElement('option'); op.value=i; op.textContent=o;
        sel.appendChild(op);
      });
      sel.value=def.val;
      sel.onchange=()=>{ def.val=+sel.value; if(ex.onChange) ex.onChange(state,ex.params); };
      row.append(lab,sel);
    } else {
      const inp=document.createElement('input');
      inp.type='range'; inp.min=def.min; inp.max=def.max; inp.step=def.step; inp.value=def.val;
      const val=document.createElement('span'); val.className='val'; val.textContent=fmtVal(def.val,def);
      inp.oninput=()=>{
        def.val=+inp.value;
        val.textContent=fmtVal(def.val,def);
        if(ex.onChange) ex.onChange(state,ex.params);
      };
      row.append(lab,inp,val);
    }
    box.appendChild(row);
  }
}

function updateInfo(ex){
  document.getElementById('infoName').textContent=ex.name;
  document.getElementById('infoHist').textContent=ex.hist;
  document.getElementById('infoFormulas').innerHTML=
    ex.formulas.map(f=>`<div class="fml">${f}</div>`).join('');
  document.getElementById('infoKnow').textContent=ex.knowledge;
}

function loadExperiment(ex){
  current=ex;
  state={};
  ex.reset(state,ex.params);
  buildParams(ex);
  updateInfo(ex);
  document.querySelectorAll('.ex').forEach(el=>{
    el.classList.toggle('active', el.dataset.id===ex.id);
  });
}

function buildList(){
  const list=document.getElementById('exlist');
  const cats={};
  EX.forEach(ex=>{ (cats[ex.cat]=cats[ex.cat]||[]).push(ex); });

  const order=['经典力学','电磁学','热学','光学与波动','量子力学','相对论'];
  const keys=Object.keys(cats).sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });

  keys.forEach(cat=>{
    const h=document.createElement('div');
    h.className='cat'; h.textContent=cat;
    list.appendChild(h);
    cats[cat].forEach(ex=>{
      const d=document.createElement('div');
      d.className='ex'; d.dataset.id=ex.id; d.textContent=ex.name;
      d.title=ex.name;
      d.onclick=()=>loadExperiment(ex);
      list.appendChild(d);
    });
  });
}

/* 按钮 */
document.getElementById('btnPlay').onclick=function(){
  running=!running;
  this.textContent=running?'⏸ 暂停':'▶ 继续';
  this.classList.toggle('on',running);
};
document.getElementById('btnReset').onclick=()=>{
  if(current){ state={}; current.reset(state,current.params); }
};
document.getElementById('btnInfo').onclick=function(){
  const panel=document.getElementById('info');
  panel.classList.toggle('hidden');
  this.classList.toggle('on', !panel.classList.contains('hidden'));
};

/* 主循环 */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;
  last=now;
  dt=Math.min(dt,0.05);

  if(running && current && current.update){
    current.update(state,current.params,dt);
  }

  ctx.clearRect(0,0,W,H);
  if(current){
    current.draw(ctx,state,current.params,W,H);
  }

  requestAnimationFrame(loop);
}

/* 启动 */
resize();
buildList();
loadExperiment(EX[0]);
requestAnimationFrame(loop);
</script>
