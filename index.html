<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 遊戲館｜同學用 AI 製作的網頁遊戲</title>
  <meta name="description" content="同學用 AI 製作的 HTML 遊戲，一上傳就可以玩。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@700;800;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">跳至主要內容</a>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html"><span data-site-name>AI 遊戲館</span></a>
      <nav class="site-nav" aria-label="主選單">
        <a class="nav-home" href="index.html" aria-current="page">遊戲大廳</a>
        <a href="guide.html">製作教學</a>
        <a class="btn btn-primary" href="upload.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#i-upload"></use></svg>上傳遊戲</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero">
      <div class="container">
        <div>
          <h1><span class="line">同學用 AI 做的遊戲，</span><span class="line"><span class="mark">一上傳就能玩</span></span></h1>
          <p class="hero-lead">把 AI 幫你寫好的 HTML 遊戲放上來，全班都可以即時試玩。五子棋、問答、動作遊戲，全部歡迎。</p>
          <div class="hero-actions">
            <a class="btn btn-primary btn-lg" href="upload.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#i-upload"></use></svg>上傳我的遊戲</a>
            <a class="btn btn-lg" href="guide.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#i-book-open"></use></svg>怎樣用 AI 做遊戲</a>
          </div>
        </div>
        <div class="hero-board" id="heroBoard" role="img" aria-label="座標平面上的五子棋：五顆黑子沿直線 y = x + 1 連成一線，其中一顆位於 (1, 2)"></div>
      </div>
    </section>

    <section class="container" aria-labelledby="gamesTitle">
      <div class="toolbar">
        <div class="toolbar-head">
          <h2 id="gamesTitle">全部遊戲</h2>
          <span class="count" id="count" aria-live="polite"></span>
        </div>
        <div class="search">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#i-search"></use></svg>
          <label class="sr-only" for="q">搜尋遊戲</label>
          <input class="input" id="q" type="search" placeholder="搜尋遊戲名稱、作者或班別" autocomplete="off" />
        </div>
        <div>
          <label class="sr-only" for="sort">排序</label>
          <select class="select" id="sort">
            <option value="new">最新上傳</option>
            <option value="old">最早上傳</option>
            <option value="name">按名稱</option>
          </select>
        </div>
        <div class="chips" id="chips" role="group" aria-label="按分類篩選"></div>
      </div>

      <div class="game-grid" id="grid" aria-busy="true"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span data-year>2026</span> <span data-site-name>AI 遊戲館</span>　欣賞同學的作品，也請尊重別人的創作。</p>
      <nav aria-label="頁尾連結">
        <a href="admin.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#i-lock"></use></svg>老師管理</a>
        <a data-repo-link href="https://github.com/dssfgs/student-game-hub" target="_blank" rel="noopener noreferrer">GitHub 儲存庫<svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#i-external-link"></use></svg></a>
      </nav>
    </div>
  </footer>

  <script type="module" src="assets/js/gallery.js"></script>
</body>
</html>
